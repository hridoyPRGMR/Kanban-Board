<aside class="h-full bg-white border-r border-gray-200 flex flex-col transition-all duration-300 flex-shrink-0"
    [class.w-64]="expanded()" [class.w-20]="!expanded()">

    <!-- Logo Area -->
    <div class="h-16 flex items-center justify-center border-b border-gray-100">
        <div class="w-8 h-8 text-indigo-600" [innerHTML]="icons.logo"></div>
        <!-- @if for new control flow -->
        @if (expanded()) {
        <span class="ml-3 font-bold text-xl text-gray-800 tracking-tight whitespace-nowrap">Kanban<span
                class="text-indigo-600">Pro</span></span>
        }
    </div>

    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto py-4">
        <ul class="space-y-1 px-3">
            <!-- Item: Board -->
            <li>
                <a href="#"
                    class="flex items-center px-3 py-2.5 rounded-lg bg-indigo-50 text-indigo-700 group transition-colors">
                    <div class="flex-shrink-0" [innerHTML]="icons.board"></div>
                    @if (expanded()) {
                    <span class="ml-3 font-medium whitespace-nowrap">Board</span>
                    }
                </a>
            </li>

            <!-- Item: Settings -->
            <li>
                <a href="#"
                    class="flex items-center px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors">
                    <div class="flex-shrink-0" [innerHTML]="icons.settings"></div>
                    @if (expanded()) {
                    <span class="ml-3 font-medium whitespace-nowrap">Settings</span>
                    }
                </a>
            </li>
        </ul>
    </nav>

    <!-- Toggle Button (Bottom) -->
    <div class="p-4 border-t border-gray-100 flex justify-end">
        <button (click)="toggleSidebar()" class="p-1.5 rounded-md hover:bg-gray-100 text-gray-500">
            <svg class="w-5 h-5 transform transition-transform" [class.rotate-180]="!expanded()" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7">
                </path>
            </svg>
        </button>
    </div>
</aside>
