<div class="flex-shrink-0 w-80 max-h-full flex flex-col bg-gray-100/50 rounded-xl border border-gray-200/60 shadow-sm">

    <!-- Column Header -->
    <div class="p-3 flex items-center justify-between border-b border-gray-200/50">
        <div class="flex items-center space-x-2">
            <!-- Dynamic border color based on column data -->
            <span class="w-3 h-3 rounded-full" [class]="'bg-' + column().color + '-500'"></span>
            <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider">{{ column().title }}</h2>
            <span class="bg-gray-200 text-gray-600 py-0.5 px-2 rounded-full text-xs font-semibold">{{
                column().tasks.length }}</span>
        </div>
        <button class="text-gray-400 hover:text-gray-600 p-1 rounded hover:bg-gray-200 transition"
            [innerHTML]="icons.more"></button>
    </div>

    <!-- Task List (Vertical Scroll) -->
    <div class="flex-1 overflow-y-auto p-3 space-y-3 min-h-0 custom-scrollbar">

        <!-- @for loop for new control flow -->
        @for (task of column().tasks; track task.id) {
        <!-- Task Card -->
        <div
            class="bg-white p-4 rounded-xl border border-gray-200 shadow-md hover:shadow-xl hover:border-indigo-400 cursor-grab active:cursor-grabbing transition-all group">

            <div class="flex justify-between items-start mb-2">
                <!-- Tag -->
                <span class="text-xs font-semibold px-2 py-1 rounded-full bg-indigo-50 text-indigo-600">{{ task.tag
                    }}</span>
                <!-- More Options Button -->
                <button class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-gray-600 transition">
                    <div [innerHTML]="icons.more" class="transform scale-75"></div>
                </button>
            </div>

            <!-- Title -->
            <h3 class="text-gray-800 font-medium text-sm leading-snug mb-3">{{ task.title }}</h3>

            <!-- Footer: Assignee & Due Date -->
            <div class="flex items-center justify-between mt-2 pt-2 border-t border-gray-100">
                <div class="flex items-center text-xs text-gray-500 space-x-2">
                    <img class="h-6 w-6 rounded-full ring-1 ring-white shadow-sm object-cover"
                        [src]="'https://ui-avatars.com/api/?name=' + task.assignee + '&background=random&color=fff'"
                        [alt]="task.assignee" />
                    <span>{{ task.assignee }}</span>
                </div>
                <div class="flex items-center text-gray-400 text-xs space-x-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                        </path>
                    </svg>
                    <span class="font-medium">{{ task.dueDate }}</span>
                </div>
            </div>

        </div>
        } @empty {
        <!-- Empty State -->
        <div
            class="h-24 border-2 border-dashed border-gray-300/50 rounded-lg flex items-center justify-center text-gray-400 text-sm italic transition hover:border-indigo-400">
            Drag tasks here or use the button below.
        </div>
        }

    </div>

    <!-- Column Footer (Add Task) -->
    <div class="p-3 mt-auto border-t border-gray-200/50">
        <button
            class="w-full py-2 flex items-center justify-center text-gray-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg text-sm font-medium transition-colors">
            <span class="mr-1 text-lg leading-none">+</span> Add New Task
        </button>
    </div>

</div>
