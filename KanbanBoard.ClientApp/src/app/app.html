 <div class="flex h-screen w-screen bg-gray-50 overflow-hidden font-sans">
      
      <!-- 1. Sidebar (Passes control signal up) -->
      <app-sidebar class="flex-shrink-0 z-20 shadow-xl md:shadow-none"
                   (sidebarToggled)="isSidebarExpanded.set($event)">
      </app-sidebar>

      <!-- 2. Main Content Area -->
      <div class="flex flex-col flex-1 min-w-0" 
           [class.md:pl-0]="isSidebarExpanded()" 
           [class.md:pl-0]="!isSidebarExpanded()">

        <!-- Header -->
        <app-header></app-header>

        <!-- 3. Kanban Board Scrollable Area -->
        <main class="flex-1 overflow-x-auto overflow-y-hidden">
          <div class="h-full p-6 inline-flex items-start space-x-6">
            
            <!-- Columns Loop -->
            <!-- Use @for for efficient iteration (Angular v17+) -->
            @for (col of columns(); track col.id) {
              <app-kanban-column [column]="col"></app-kanban-column>
            }

            <!-- Add Column Button -->
            <button class="flex-shrink-0 w-80 h-full max-h-full flex items-center justify-center border-2 border-dashed border-gray-300 rounded-xl text-gray-500 font-medium hover:border-indigo-500 hover:text-indigo-600 transition-colors">
              + Add New Column
            </button>
            
            <!-- Spacing shim for right edge -->
            <div class="w-6 flex-shrink-0"></div>
          </div>
        </main>
      </div>
    </div>
