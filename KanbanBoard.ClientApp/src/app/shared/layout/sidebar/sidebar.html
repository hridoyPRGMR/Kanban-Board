<aside
  class="h-full bg-white border-r border-gray-200 flex flex-col flex-shrink-0
         transition-all duration-300"
  [class.w-64]="expanded()"
  [class.w-20]="!expanded()"
>
  <!-- Logo -->
  <div class="h-16 flex items-center justify-center border-b border-gray-100 px-4">
    <div class="w-8 h-8 text-indigo-600" [innerHTML]="icons.logo"></div>

    @if (expanded()) {
      <span
        class="ml-3 font-bold text-xl text-gray-800 tracking-tight whitespace-nowrap"
      >
        Kanban<span class="text-indigo-600">Pro</span>
      </span>
    }
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto py-4">
    <ul class="space-y-1 px-3">
      @for (item of navItems; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-indigo-50 text-indigo-700"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg
                   text-gray-600 hover:bg-gray-50 hover:text-gray-900
                   transition-colors"
          >
            <span class="flex-shrink-0" [innerHTML]="getIcon(item.icon)"></span>

            @if (expanded()) {
              <span class="font-medium whitespace-nowrap">
                {{ item.title }}
              </span>
            }
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Collapse Button -->
  <div class="p-4 border-t border-gray-100 flex justify-end">
    <button
      (click)="toggleSidebar()"
      class="p-1.5 rounded-md text-gray-500 hover:bg-gray-100
             transition-colors"
      aria-label="Toggle sidebar"
    >
      <svg
        class="w-5 h-5 transition-transform"
        [class.rotate-180]="!expanded()"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M11 19l-7-7 7-7m8 14l-7-7 7-7"
        />
      </svg>
    </button>
  </div>
</aside>
