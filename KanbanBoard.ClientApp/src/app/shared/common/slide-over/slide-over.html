@if(open()){
  <div
    class="fixed inset-0 z-40 bg-black/10 backdrop-blur-sm transition-opacity duration-300"
    (click)="onBackdropClick()"
  ></div>
}

<div
    class="fixed inset-y-0 z-50 pointer-events-none transform transition-transform duration-200 ease-in-out"
    [class.right-0]="position() === 'right'"
    [class.left-0]="position() === 'left'"
>
    <div
        class="pointer-events-auto h-full rounded-xl
             transform transition-transform duration-200 ease-out"
      
        [style.width.px]="panelWidth()"
        [class.translate-x-0]="open()"
        [class.translate-x-full]="!open() && position() === 'right'"
        [class.-translate-x-full]="!open() && position() === 'left'"
    >
      <div class="h-full p-4">
        <div class="overflow-y-auto h-full bg-white rounded-lg p-3">
            <div class="slideover-header -mx-3 px-3 pb-3 border-b border-gray-200">
                <h3 class="font-semibold">{{ title() }}</h3>
            </div>

            <div class="mt-3">
                <ng-content></ng-content>
            </div>
        </div>
      </div>
    </div>
</div>
