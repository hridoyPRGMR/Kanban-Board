<div class="group flex items-center justify-between w-full p-2 hover:bg-slate-100 border-b border-gray-100 transition-colors cursor-pointer rounded-md">
    <div class="flex items-center gap-3 min-w-0">
        <div class="flex-shrink-0 w-6 h-6 rounded bg-indigo-100 flex items-center justify-center">
            <span class="text-[10px] font-bold text-indigo-700">{{ name().slice(0,2) }}</span>
        </div>
        
        <div class="flex flex-col min-w-0">
            <h3 class="text-sm font-medium text-gray-700 truncate group-hover:text-indigo-600 transition-colors">
                {{name()}}
            </h3>
            @if(createdAt()){
                <span class="text-[10px] text-gray-400 font-normal">
                    Created {{createdAt() | date: 'MMM d, y, h:mm a'}}
                </span>
            }
        </div>
    </div>

    <div class="opacity-0 group-hover:opacity-100 flex items-center gap-2 transition-opacity">
        <button class="p-1 hover:bg-gray-200 rounded">
            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
    </div>
</div>
